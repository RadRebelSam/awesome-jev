name: Update index

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch every README instead of using the cache'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      ROBINREACH_API_KEY: ${{ secrets.ROBINREACH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover and score candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/fetch.js ${{ inputs.force && '--force' || '' }}

      - name: Judge new candidates with Jev
        if: ${{ env.AI_GATEWAY_API_KEY != '' || env.TYPESAFE_API_KEY != '' }}
        run: |
          node tools/triage.js
          node tools/triage-merge.js
          node tools/rescore.js

      - name: Refresh stars and push dates for tracked entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/refresh.js

      - name: Render README and site data
        run: |
          node tools/render.js
          node tools/build-site.js

      # Runs after the render so it sees the day's refreshed star counts, and
      # before the commit so data/posted.json lands in the same commit.
      - name: Draft a post if anything is worth saying
        if: ${{ env.ROBINREACH_API_KEY != '' }}
        run: node tools/post-updates.js

      - name: Commit
        id: commit
        run: |
          git config user.name 'awesome-jev bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing changed'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh index ($(date -u +%Y-%m-%d))"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  # A push made with GITHUB_TOKEN does not start another workflow, so the site
  # deploy has to be chained here rather than left to the push trigger.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
