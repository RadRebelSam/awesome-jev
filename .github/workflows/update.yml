name: Update index

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch every README instead of using the cache'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover and score candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/fetch.js ${{ inputs.force && '--force' || '' }}

      - name: Judge new candidates with Jev
        if: ${{ env.AI_GATEWAY_API_KEY != '' || env.TYPESAFE_API_KEY != '' }}
        run: |
          node tools/triage.js
          node tools/triage-merge.js
          node tools/rescore.js

      - name: Refresh stars and push dates for tracked entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/refresh.js

      - name: Render README and site data
        run: |
          node tools/render.js
          node tools/build-site.js

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/index-update
          delete-branch: true
          commit-message: 'chore: refresh index'
          title: 'chore: refresh index'
          labels: automated
          body-path: data/last-run.md
